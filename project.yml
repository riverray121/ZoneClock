name: ZoneClock
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Automatic signing; the team is pinned here because regenerating the project
    # from this spec discards any selection made in Xcode.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 76DJ96729W
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  ZoneClock:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riverray.ZoneClock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - Sources/App
      - Resources
    info:
      path: Info/ZoneClock-Info.plist
      properties:
        CFBundleDisplayName: ZoneClock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ZoneClockTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests
    dependencies:
      - target: ZoneClock

  ZoneClockUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - UITests
    dependencies:
      - target: ZoneClock

schemes:
  ZoneClock:
    build:
      targets:
        ZoneClock: all
    run:
      config: Debug
    test:
      targets:
        - ZoneClockTests
        - ZoneClockUITests
